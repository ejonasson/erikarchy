# https://wiki.hypr.land/Hypr-Ecosystem/hyprlock/
# Shortcuts to clear the password buffer: ESC, Ctrl+U, Ctrl+Backspace

$font   = JetBrainsMono Nerd Font
$peach  = rgba(fab387ee)
$accent2 = rgba(f38ba8ee)
$red    = rgba(f38ba8ee)
$text   = rgba(cdd6f4ff)
$muted  = rgba(a6adc8aa)
$yellow = rgba(f9e2afff)

general {
    hide_cursor = true
    ignore_empty_input = true
}

animations {
    enabled = true
    bezier = easeOut, 0.23, 1, 0.32, 1
    animation = fadeIn, 1, 5, easeOut
    animation = fadeOut, 1, 5, easeOut
    animation = inputFieldDots, 1, 2, easeOut
}

background {
    monitor =
    path = ~/Pictures/wallpapers/red-diamond-martin-martz.jpg
    blur_passes = 2
    blur_size = 6
    brightness = 0.6
}

# TIME
label {
    monitor =
    text = $TIME
    color = $text
    font_size = 96
    font_family = JetBrainsMono NF ExtraLight
    position = 0, 160
    halign = center
    valign = center
}

# DATE
label {
    monitor =
    text = cmd[update:60000] date +"%A · %d %B" | tr '[:lower:]' '[:upper:]'
    color = $muted
    font_size = 14
    font_family = $font
    position = 0, 70
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 48
    outline_thickness = 2
    rounding = 10
    outer_color = $peach $accent2 45deg
    inner_color = rgba(1e1e2ecc)
    font_color = $text
    font_family = $font
    check_color = $accent2 $peach 120deg
    fail_color = $red
    fail_text = <i>$PAMFAIL</i>
    placeholder_text = <span foreground="##a6adc8">  password</span>
    fade_on_empty = false
    dots_size = 0.22
    dots_spacing = 0.4
    dots_center = true
    position = 0, -20
    halign = center
    valign = center
}

# CAPS LOCK WARNING (reads the keyboard LED; blank when off)
label {
    monitor =
    text = cmd[update:250] grep -qs 1 /sys/class/leds/*::capslock/brightness && echo "󰪛  Caps Lock is on" || echo ""
    color = $yellow
    font_size = 12
    font_family = $font
    position = 0, -75
    halign = center
    valign = center
}

# USER + BATTERY
label {
    monitor =
    text = cmd[update:30000] echo "$USER  ·  󰁹 $(cat /sys/class/power_supply/BAT0/capacity)%"
    color = $muted
    font_size = 11
    font_family = $font
    position = 0, 30
    halign = center
    valign = bottom
}
