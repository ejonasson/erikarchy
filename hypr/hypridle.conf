# https://wiki.hypr.land/Hypr-Ecosystem/hypridle/

$on_battery = [ "$(cat /sys/class/power_supply/ADP1/online)" = 0 ]

general {
    lock_cmd = pidof hyprlock || hyprlock                             # avoid starting multiple hyprlock instances
    before_sleep_cmd = loginctl lock-session                          # lock before suspend (incl. lid close)
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action = "on"})' # screen on after resume without a key press
}

# 2.5 min: dim the backlight
listener {
    timeout = 150
    on-timeout = brightnessctl -s set 10%
    on-resume = brightnessctl -r
}

# 5 min: lock
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# 5.5 min: screen off
listener {
    timeout = 330
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({action = "off"})'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}

# 15 min: suspend, on battery only
listener {
    timeout = 900
    on-timeout = $on_battery && systemctl suspend
}

# 30 min: suspend, even when plugged in
listener {
    timeout = 1800
    on-timeout = systemctl suspend
}
